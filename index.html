<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FUP – Grandes Negócios</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7f6;--card:#fff;--tx:#1b2420;--mu:#6b7670;--bd:#e4e8e5;--ac:#0f5b4a;--ac2:#e3f1ec;
--q:#fde4e1;--qt:#b3261e;--m:#fdf0d5;--mt:#9a6700;--f:#e2eefb;--ft:#1d5fa8;--bar:#0f5b4a}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121715;--card:#1b2220;--tx:#e8eeeb;--mu:#93a09a;--bd:#2c3532;--ac:#4fc3a1;--ac2:#1f3a32;--q:#4a2321;--qt:#ff9e96;--m:#43361a;--mt:#f0c36a;--f:#1f3350;--ft:#8fbcf0;--bar:#4fc3a1}}
:root[data-theme="dark"]{--bg:#121715;--card:#1b2220;--tx:#e8eeeb;--mu:#93a09a;--bd:#2c3532;--ac:#4fc3a1;--ac2:#1f3a32;--q:#4a2321;--qt:#ff9e96;--m:#43361a;--mt:#f0c36a;--f:#1f3350;--ft:#8fbcf0;--bar:#4fc3a1}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:flex;min-height:100vh}
aside{width:240px;background:var(--card);border-right:1px solid var(--bd);padding:18px 12px;display:flex;flex-direction:column;gap:4px;flex:none}
.logo{font-weight:800;font-size:24px;color:var(--ac);padding:0 8px 16px;letter-spacing:-1px}
.nav{display:block;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:10px;color:var(--tx);cursor:pointer;font:inherit}
.nav b{display:block;font-weight:600}.nav small{color:var(--mu)}
.nav.on{background:var(--ac2)}.nav.on b{color:var(--ac)}
.foot{margin-top:auto;font-size:11px;color:var(--mu);padding:8px}
main{flex:1;min-width:0}
header{display:flex;align-items:center;gap:12px;padding:12px 24px;background:var(--card);border-bottom:1px solid var(--bd);flex-wrap:wrap}
header h1{font-size:15px;margin:0}header small{color:var(--mu);display:block;font-weight:400}
.sp{flex:1}
label.c{font-size:11px;letter-spacing:.08em;color:var(--mu);text-transform:uppercase}
select,input,button.b{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px}
.wrap{padding:22px 24px;max-width:1300px}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
.top{display:flex;align-items:end;justify-content:space-between;margin:2px 0 18px;gap:12px;flex-wrap:wrap}
h2{margin:0;font-size:26px;letter-spacing:-.5px}
.pri{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .pri{color:#07261d}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px}
.kpi{padding:16px 18px}.kpi .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.kpi .v{font-size:26px;font-weight:700;color:var(--ac);margin:6px 0 2px}.kpi .v.red{color:var(--qt)}.kpi .s{color:var(--mu);font-size:12px}
.bar{display:flex;gap:10px;padding:14px;flex-wrap:wrap;align-items:center}
.seg{display:flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.seg button{border:0;background:none;color:var(--mu);padding:8px 12px;cursor:pointer;font:inherit}
.seg button.on{background:var(--ac2);color:var(--ac);font-weight:600}
.bar input{flex:1;min-width:180px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:860px}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);text-align:left;padding:10px 14px;background:var(--bg);border-top:1px solid var(--bd);border-bottom:1px solid var(--bd);cursor:pointer;white-space:nowrap;user-select:none}
th.r,td.r{text-align:right}
td{padding:13px 14px;border-bottom:1px solid var(--bd);vertical-align:middle}
td.n{font-weight:600}td.ob{max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mu)}
.t{padding:3px 9px;border-radius:6px;font-size:12px;font-weight:500}
.Quente{background:var(--q);color:var(--qt)}.Morno{background:var(--m);color:var(--mt)}.Frio{background:var(--f);color:var(--ft)}
.st{font-size:12px;color:var(--mu)}
.ed{background:none;border:0;color:var(--ac);cursor:pointer;font-weight:600;font:inherit}
.empty{padding:30px;text-align:center;color:var(--mu)}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-bottom:14px}
.ch{padding:16px 18px}.ch h3{margin:0 0 14px;font-size:14px}
.row{display:grid;grid-template-columns:70px 1fr 110px;gap:10px;align-items:center;margin:8px 0;font-size:13px}
.trk{height:14px;background:var(--bg);border-radius:7px;overflow:hidden;display:flex}
.trk i{display:block;height:100%}
.lg{display:flex;gap:14px;font-size:12px;color:var(--mu);margin-top:10px}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);padding:0;width:min(520px,94vw)}
dialog::backdrop{background:#0006}
form{padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
form h3{grid-column:1/-1;margin:0}form label{font-size:12px;color:var(--mu);display:grid;gap:4px}form .f{grid-column:1/-1}
form .act{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end}
.dg{color:var(--qt);margin-right:auto;background:none;border:0;cursor:pointer;font:inherit}
@media(max-width:860px){aside{display:none}.kpis{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.wrap{padding:16px}header{padding:12px 16px}}
:root{--c1:#0fa37f;--c2:#3b82f6;--c3:#f59e0b;--c4:#8b5cf6;--c5:#ec4899;--hot:#ef4444;--warm:#f59e0b;--cold:#3b82f6}
aside{background:linear-gradient(180deg,#0f5b4a,#0a3d4f);border:0}
.logo,.nav,.nav b{color:#fff}.nav small,.foot{color:rgba(255,255,255,.65)}
.nav:hover{background:rgba(255,255,255,.09)}.nav.on{background:rgba(255,255,255,.18)}.nav.on b{color:#fff}
header{border-top:4px solid;border-image:linear-gradient(90deg,var(--c1),var(--c2),var(--c4),var(--c5),var(--c3)) 1}
.pri{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff!important}
.kpi{position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--kc)}
.kpi::after{content:"";position:absolute;right:-22px;top:-22px;width:96px;height:96px;border-radius:50%;background:var(--kc);opacity:.13}
.k1{--kc:var(--c2)}.k2{--kc:var(--c1)}.k3{--kc:var(--hot)}.k4{--kc:var(--c4)}
.kpi .v{color:var(--kc)!important}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
@media(max-width:1100px){.g3{grid-template-columns:1fr 1fr}}@media(max-width:700px){.g3{grid-template-columns:1fr}}
.lgv div{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}.lgv i{width:11px;height:11px;border-radius:3px;display:block}
.row{grid-template-columns:100px 1fr 100px}.trk{height:14px;border-radius:7px}
.Quente{background:color-mix(in srgb,var(--hot) 16%,transparent);color:var(--hot);font-weight:600}
.Morno{background:color-mix(in srgb,var(--warm) 20%,transparent);color:var(--warm);font-weight:600}
.Frio{background:color-mix(in srgb,var(--cold) 16%,transparent);color:var(--cold);font-weight:600}
.eq{padding:3px 9px;border-radius:6px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--cx) 16%,transparent);color:var(--cx);white-space:nowrap}
tbody tr:hover{background:var(--ac2)}
.logo{background:#fff;border-radius:12px;padding:6px 10px;margin:0 4px 16px;display:flex;justify-content:center}.logo img{display:block;width:100%;max-width:170px;height:auto}
#gate{position:fixed;inset:0;z-index:9999;background:linear-gradient(135deg,#0f5b4a,#0a3d4f);display:flex;align-items:center;justify-content:center;padding:20px}
#gate form{display:block;background:var(--card);border-radius:16px;padding:28px;width:min(360px,100%);text-align:center;box-shadow:0 20px 60px #0006}
#gate img{width:170px;max-width:100%;margin-bottom:8px}#gate h3{margin:6px 0 4px}#gate p{color:var(--mu);margin:0 0 16px;font-size:13px}
#gate input{width:100%;margin-bottom:10px;text-align:center;font-size:16px}#gate button{width:100%}#gate .er{color:var(--hot);font-size:12px;min-height:16px;margin-top:8px}
</style>
</head>

<dialog id="dlg"><form id="frm" method="dialog">
 <h3 id="dt">Nova negociação</h3>
 <label class="f">Cliente<input id="fc" required></label>
 <label>Equipamento<input id="fe" list="eqs" required></label>
 <datalist id="eqs"><option>3D<option>2D<option>Consultório<option>Scanner IOS<option>Periféricos</datalist>
 <label>Terceiro<input id="fo"></label>

 <label>Atuação CTI<select id="facti"><option value="">Selecione</option><option value="Sim">Sim</option><option value="Não">Não</option></select></label>
 <label>Valor (R$)<input id="fv" type="number" min="0" step="0.01" required></label>
 <label>Fechamento<input id="ff" type="month" required></label>
 <label>Temperatura<select id="ft"><option>Quente<option>Morno<option>Frio</select></label>

</form></dialog>


<script>
const KEY="fup-v1",MES=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
const seed = [];


let D=[],S={tab:"aberto",temp:"todas",coordenador:"todos",q:"",sort:"v",dir:-1,view:"fup",comp:"2026-09",edit:null};
try{const r=localStorage.getItem(KEY);D=r?JSON.parse(r):seed}catch(e){D=seed}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}};
const $=s=>document.querySelector(s);
const brl=n=>"R$ "+Math.round(n).toLocaleString("pt-BR");
const mlab=m=>{const[a,b]=m.split("-");return MES[+b-1]+"/"+a.slice(2)};
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));


function months(){const s=new Set(["2026-09"]);D.forEach(d=>s.add(d.f));for(let i=0;i<12;i++){s.add(`2026-${String(i+1).padStart(2,"0")}`)}return[...s].sort()}
function fillComp(){const c=$("#comp");c.innerHTML=months().map(m=>`<option value="${m}"${m===S.comp?" selected":""}>${MES[+m.slice(5)-1]} / ${m.slice(0,4)}</option>`).join("")}
function fillCoordenadores(){const vals=[...new Set(D.map(d=>(d.coordenador||"").trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"pt-BR"));$("#coords").innerHTML=vals.map(v=>`<option value="${esc(v)}"></option>`).join("")}


function kpis(){
 const ab=D.filter(d=>d.s==="aberto"),sum=a=>a.reduce((x,d)=>x+d.v,0);
 const prev=ab.filter(d=>d.f===S.comp),venc=ab.filter(d=>d.f<S.comp);
 const g=D.filter(d=>d.s==="ganho"),p=D.filter(d=>d.s==="perdido");
 const ap=g.length+p.length?Math.round(sum(g)/(sum(g)+sum(p))*100):0;
 return`<div class="kpis">
 <div class="card kpi k1"><div class="l">Em aberto</div><div class="v">${brl(sum(ab))}</div><div class="s">${ab.length} negociações</div></div>
 <div class="card kpi k2"><div class="l">Previsão de recebimentos — ${mlab(S.comp)}</div><div class="v">${brl(sum(prev))}</div><div class="s">${prev.length} negociações previstas</div></div>
 <div class="card kpi k3"><div class="l">Fechamento vencido</div><div class="v ${venc.length?"red":""}">${brl(sum(venc))}</div><div class="s">${venc.length?venc.length+" negociação(ões) atrasada(s)":"nenhuma negociação atrasada"}</div></div>
 <div class="card kpi k4"><div class="l">Ganhos acumulados</div><div class="v">${brl(sum(g))}</div><div class="s">${ap}% de aproveitamento</div></div></div>`}


function fup(){
 const cnt=s=>D.filter(d=>d.s===s).length;
 const tabs=[["aberto","Em Aberto"],["ganho","Ganho"],["perdido","Perdido"],["todos","Todos"]];
 let L=D.filter(d=>(S.tab==="todos"||d.s===S.tab)&&(S.temp==="todas"||d.t===S.temp)&&(S.coordenador==="todos"||(d.coordenador||"")===S.coordenador));
 const q=S.q.toLowerCase();if(q)L=L.filter(d=>[d.c,d.e,d.o,d.coordenador,d.atuacaoCTI,d.b,d.k].join(" ").toLowerCase().includes(q));
 L.sort((a,b)=>(a[S.sort]>b[S.sort]?1:-1)*S.dir);
 const th=(k,t,r)=>`<th data-s="${k}" class="${r?"r":""}">${t}${S.sort===k?(S.dir>0?" ▲":" ▼"):""}</th>`;
 return`<div class="eyebrow">Acompanhamento de segmento</div>
 <div class="top"><h2>FUP – Grandes Negócios</h2><div><button class="b" id="csv">Exportar CSV</button> <button class="pri" id="new">+ Nova negociação</button></div></div>
 ${kpis()}${charts()}
 <div class="card"><div class="bar">
 <div class="seg">${tabs.map(([k,t])=>`<button data-tab="${k}" class="${S.tab===k?"on":""}">${t} (${k==="todos"?D.length:cnt(k)})</button>`).join("")}</div>
 <div class="seg">${["todas","Quente","Morno","Frio"].map(t=>`<button data-temp="${t}" class="${S.temp===t?"on":""}">${t}</button>`).join("")}</div>
 <select id="fcoordfilter" aria-label="Filtrar por coordenador"><option value="todos">Todos os coordenadores</option>${[...new Set(D.map(d=>(d.coordenador||"").trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"pt-BR")).map(v=>`<option value="${esc(v)}" ${S.coordenador===v?"selected":""}>${esc(v)}</option>`).join("")}</select>
 <input id="q" placeholder="Buscar cliente, equipamento, coordenador…" value="${esc(S.q)}"></div>
 <div class="tw"><table><thead><tr>${th("c","Cliente")}${th("e","Equipamento")}${th("o","Terceiro")}${th("coordenador","Coordenador")}${th("atuacaoCTI","Atuação CTI")}${th("v","Valor",1)}${th("f","Fechamento")}${th("t","Temp.")}${th("k","Concorrentes")}<th>Observações</th><th></th></tr></thead><tbody>
 ${L.map(d=>`<tr><td class="n">${esc(d.c)}${d.s!=="aberto"?`<div class="st">${d.s==="ganho"?"Ganho":"Perdido"}</div>`:""}</td><td><span class="eq" style="--cx:${eqc(d.e)}">${esc(d.e)}</span></td><td>${esc(d.o)}</td><td>${esc(d.coordenador)||"—"}</td><td>${esc(d.atuacaoCTI)||"—"}</td><td class="r n">${brl(d.v)}</td><td${d.s==="aberto"&&d.f<S.comp?' style="color:var(--qt);font-weight:600"':""}>${mlab(d.f)}</td><td><span class="t ${d.t}">${d.t}</span></td><td>${esc(d.k)||"—"}</td><td class="ob" title="${esc(d.b)}">${esc(d.b)}</td><td><button class="ed" data-id="${d.id}">Editar</button></td></tr>`).join("")||`<tr><td colspan="11" class="empty">Nenhuma negociação encontrada.</td></tr>`}
 </tbody></table></div></div>`}


const TC={Quente:"var(--hot)",Morno:"var(--warm)",Frio:"var(--cold)"},EQ=["var(--c1)","var(--c2)","var(--c3)","var(--c4)","var(--c5)"];
const eqc=e=>EQ[[...e].reduce((a,c)=>a+c.charCodeAt(0),0)%EQ.length];
const sm=(a,f)=>a.reduce((x,d)=>x+f(d),0);
const mm=n=>"R$ "+(n>=1e6?(n/1e6).toFixed(2).replace(".",",")+" mi":Math.round(n/1e3)+" mil");
function donut(items,center,sub){
 const tot=items.reduce((a,i)=>a+i[1],0)||1,C=2*Math.PI*62;let off=0;
 const seg=items.map(([l,v,c])=>{const len=v/tot*C;const s=`<circle r="62" cx="80" cy="80" fill="none" stroke-width="22" style="stroke:${c}" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 80 80)"><title>${l}: ${brl(v)}</title></circle>`;off+=len;return s}).join("");
 return `<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap"><svg viewBox="0 0 160 160" width="150" height="150">${seg}<text x="80" y="79" text-anchor="middle" style="fill:var(--tx);font-size:14px;font-weight:700">${center}</text><text x="80" y="95" text-anchor="middle" style="fill:var(--mu);font-size:10px">${sub}</text></svg><div class="lgv">${items.map(([l,v,c])=>`<div><i style="background:${c}"></i>${l} <b>${Math.round(v/tot*100)}%</b></div>`).join("")}</div></div>`}
function cols(ab){
 const bm={};ab.forEach(d=>{(bm[d.f]=bm[d.f]||{Quente:0,Morno:0,Frio:0})[d.t]+=d.v});
 const ms=Object.keys(bm).sort(),mx=Math.max(1,...ms.map(m=>sm(Object.values(bm[m]),x=>x)));
 const W=360,H=170,gap=W/Math.max(1,ms.length),bw=Math.min(40,gap-10);
 const g=ms.map((m,i)=>{let y=H;const x=i*gap+(gap-bw)/2;const r=["Quente","Morno","Frio"].map(t=>{const h=bm[m][t]/mx*(H-20);y-=h;return h?`<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="3" style="fill:${TC[t]}"><title>${t}: ${brl(bm[m][t])}</title></rect>`:""}).join("");return r+`<text x="${x+bw/2}" y="${H+15}" text-anchor="middle" style="fill:var(--mu);font-size:10px">${mlab(m)}</text>`}).join("");
 return `<svg viewBox="0 0 ${W} ${H+22}" style="width:100%">${g}</svg><div class="lg"><span style="color:var(--hot)">■ Quente</span><span style="color:var(--warm)">■ Morno</span><span style="color:var(--cold)">■ Frio</span></div>`}
function line(ab){
 const bm={};ab.forEach(d=>bm[d.f]=(bm[d.f]||0)+d.v);const ms=Object.keys(bm).sort();let c=0;const pts=ms.map(m=>(c+=bm[m]));
 const W=360,H=150,mx=Math.max(1,...pts),n=ms.length,px=i=>n>1?20+i*(W-40)/(n-1):W/2,py=v=>H-v/mx*(H-25);
 const p=pts.map((v,i)=>`${px(i)},${py(v)}`);
 return `<svg viewBox="0 0 ${W} ${H+22}" style="width:100%"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--c2);stop-opacity:.45"/><stop offset="1" style="stop-color:var(--c2);stop-opacity:0"/></linearGradient></defs><polygon points="${px(0)},${H} ${p.join(" ")} ${px(n-1)},${H}" fill="url(#ga)"/><polyline points="${p.join(" ")}" fill="none" stroke-width="3" style="stroke:var(--c2)"/>${pts.map((v,i)=>`<circle cx="${px(i)}" cy="${py(v)}" r="4" style="fill:var(--c2)"><title>${mlab(ms[i])}: ${brl(v)}</title></circle><text x="${px(i)}" y="${H+15}" text-anchor="middle" style="fill:var(--mu);font-size:10px">${mlab(ms[i])}</text>`).join("")}</svg>`}
function hb(es){const m=Math.max(1,...es.map(e=>e[1]));return es.map(([k,v],i)=>`<div class="row"><span>${esc(k)}</span><div class="trk"><i style="width:${v/m*100}%;background:${EQ[i%5]}"></i></div><b style="text-align:right">${brl(v)}</b></div>`).join("")}
function charts(){
 const ab=D.filter(d=>d.s==="aberto");
 const tt=["Quente","Morno","Frio"].map(t=>[t,sm(ab.filter(d=>d.t===t),d=>d.v),TC[t]]);
 const be={};ab.forEach(d=>be[d.e]=(be[d.e]||0)+d.v);
 return `<div class="g3"><div class="card ch"><h3>🌡️ Temperatura</h3>${donut(tt,mm(sm(ab,d=>d.v)),"em aberto")}</div><div class="card ch"><h3>📅 Previsão por mês</h3>${cols(ab)}</div><div class="card ch"><h3>🛠️ Por equipamento</h3>${hb(Object.entries(be).sort((a,b)=>b[1]-a[1]))}</div></div>`}
function dash(){
 const ab=D.filter(d=>d.s==="aberto"),bo={};ab.forEach(d=>bo[d.o.split(" ")[0]]=(bo[d.o.split(" ")[0]]||0)+d.v);
 const st=[["Em aberto",sm(ab,d=>d.v),"var(--c2)"],["Ganho",sm(D.filter(d=>d.s==="ganho"),d=>d.v),"var(--c1)"],["Perdido",sm(D.filter(d=>d.s==="perdido"),d=>d.v),"var(--hot)"]];
 return `<div class="eyebrow">Visão consolidada</div><div class="top"><h2>Dashboard</h2></div>${kpis()}${charts()}<div class="g3"><div class="card ch"><h3>📈 Previsão acumulada</h3>${line(ab)}</div><div class="card ch"><h3>🎯 Situação</h3>${donut(st,D.length,"negociações")}</div><div class="card ch"><h3>👤 Por responsável</h3>${hb(Object.entries(bo).sort((a,b)=>b[1]-a[1]).slice(0,6))}</div></div>`}
function dashOld(){
 const ab=D.filter(d=>d.s==="aberto");
 const bm={};ab.forEach(d=>{(bm[d.f]=bm[d.f]||{Quente:0,Morno:0,Frio:0})[d.t]+=d.v});
 const ms=Object.keys(bm).sort(),mx=Math.max(1,...ms.map(m=>Object.values(bm[m]).reduce((a,b)=>a+b,0)));
 const col={Quente:"var(--qt)",Morno:"var(--mt)",Frio:"var(--ft)"};
 const be={};ab.forEach(d=>be[d.e]=(be[d.e]||0)+d.v);
 const es=Object.entries(be).sort((a,b)=>b[1]-a[1]),em=Math.max(1,...es.map(e=>e[1]));
 const bo={};ab.forEach(d=>bo[d.o]=(bo[d.o]||0)+d.v);
 const os=Object.entries(bo).sort((a,b)=>b[1]-a[1]).slice(0,6),om=Math.max(1,...os.map(e=>e[1]));
 const tt=["Quente","Morno","Frio"].map(t=>[t,ab.filter(d=>d.t===t).reduce((a,d)=>a+d.v,0)]);
 const bar=(l,v,m,c)=>`<div class="row"><span>${esc(l)}</span><div class="trk"><i style="width:${v/m*100}%;background:${c||"var(--bar)"}"></i></div><b style="text-align:right">${brl(v)}</b></div>`;
 return`<div class="eyebrow">Visão consolidada</div><div class="top"><h2>Dashboard</h2></div>${kpis()}
 <div class="grid2"><div class="card ch"><h3>Previsão por mês e temperatura</h3>
 ${ms.map(m=>`<div class="row"><span>${mlab(m)}</span><div class="trk" style="width:100%">${["Quente","Morno","Frio"].map(t=>`<i title="${t}: ${brl(bm[m][t])}" style="width:${bm[m][t]/mx*100}%;background:${col[t]}"></i>`).join("")}</div><b style="text-align:right">${brl(Object.values(bm[m]).reduce((a,b)=>a+b,0))}</b></div>`).join("")}
 <div class="lg"><span style="color:var(--qt)">■ Quente</span><span style="color:var(--mt)">■ Morno</span><span style="color:var(--ft)">■ Frio</span></div></div>
 <div class="card ch"><h3>Funil por temperatura</h3>${tt.map(([t,v])=>bar(t,v,Math.max(1,...tt.map(x=>x[1])),col[t])).join("")}</div></div>
 <div class="grid2"><div class="card ch"><h3>Por equipamento</h3>${es.map(([k,v])=>bar(k,v,em)).join("")}</div>
 <div class="card ch"><h3>Por responsável</h3>${os.map(([k,v])=>bar(k.split(" ")[0],v,om)).join("")}</div></div>`}


function render(){
 $("#root").innerHTML=S.view==="fup"?fup():dash();
 document.querySelectorAll(".nav").forEach(n=>n.classList.toggle("on",n.dataset.v===S.view));
 const R=$("#root");
 R.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render()});
 R.querySelectorAll("[data-temp]").forEach(b=>b.onclick=()=>{S.temp=b.dataset.temp;render()});
  const fc=$("#fcoordfilter");if(fc)fc.onchange=e=>{S.coordenador=e.target.value;render()};
 R.querySelectorAll("[data-s]").forEach(h=>h.onclick=()=>{const k=h.dataset.s;S.dir=S.sort===k?-S.dir:1;S.sort=k;render()});
 R.querySelectorAll(".ed").forEach(b=>b.onclick=()=>open(+b.dataset.id));
 const q=$("#q");if(q)q.oninput=e=>{S.q=e.target.value;const p=e.target.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(p,p)};
 const nw=$("#new");if(nw)nw.onclick=()=>open(null);
 const cv=$("#csv");if(cv)cv.onclick=exportCsv;
}
function open(id){
 S.edit=id;const d=D.find(x=>x.id===id)||{c:"",e:"",o:"",coordenador:"",atuacaoCTI:"",v:"",f:S.comp,t:"Morno",k:"",b:"",s:"aberto"};
 $("#dt").textContent=id?"Editar negociação":"Nova negociação";
 $("#fc").value=d.c;$("#fe").value=d.e;$("#fo").value=d.o;$("#fcoord").value=d.coordenador||"";$("#facti").value=d.atuacaoCTI||"";$("#fv").value=d.v;$("#ff").value=d.f;$("#ft").value=d.t;$("#fs").value=d.s;$("#fk").value=d.k;$("#fb").value=d.b;
 $("#del").style.display=id?"":"none";$("#dlg").showModal();
}
$("#cx").onclick=()=>$("#dlg").close();
$("#del").onclick=()=>{if(confirm("Excluir esta negociação?")){D=D.filter(x=>x.id!==S.edit);save();$("#dlg").close();render()}};
$("#frm").onsubmit=()=>{
 const n={c:$("#fc").value.trim(),e:$("#fe").value.trim(),o:$("#fo").value.trim(),coordenador:$("#fcoord").value.trim(),atuacaoCTI:$("#facti").value.trim(),v:+$("#fv").value,f:$("#ff").value,t:$("#ft").value,s:$("#fs").value,k:$("#fk").value.trim(),b:$("#fb").value.trim()};
 if(S.edit)Object.assign(D.find(x=>x.id===S.edit),n);else D.push({id:Math.max(0,...D.map(x=>x.id))+1,...n});
 save();fillComp();fillCoordenadores();render();
};
function exportCsv(){
 const h=["Cliente","Equipamento","Terceiro","Coordenador","Atuação CTI","Valor","Fechamento","Temperatura","Situação","Concorrentes","Observações"];
 const r=D.map(d=>[d.c,d.e,d.o,d.coordenador||"",d.atuacaoCTI||"",d.v,d.f,d.t,d.s,d.k,d.b].map(x=>`"${String(x).replace(/"/g,'""')}"`).join(";"));
 const u=URL.createObjectURL(new Blob(["\ufeff"+[h.join(";"),...r].join("\n")],{type:"text/csv"}));
 const a=document.createElement("a");a.href=u;a.download="negociacoes.csv";a.click();
}
document.querySelectorAll(".nav").forEach(n=>n.onclick=()=>{S.view=n.dataset.v;render()});
$("#comp").onchange=e=>{S.comp=e.target.value;render()};
$("#theme").onclick=()=>{const r=document.documentElement,dk=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=dk?"light":"dark"};
fillComp();render();
</script>
<script>
(function(){
    const H="sygnhwaal1",
    g=document.getElementById("gate");
    const h=s=>{
        let a=0xdeadbeef,b=0x41c6ce57;
        for(let i=0;i<s.length;i++){
            const c=s.charCodeAt(i);
            a=Math.imul(a^c,2654435761);
            b=Math.imul(b^c,1597334677)
        }
        a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);
        b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);
        return(4294967296*(2097151&b)+(a>>>0)).toString(36)
    };
try{if(sessionStorage.getItem("fup-ok")===H)g.remove()}catch(e){}
document.getElementById("gf").onsubmit=e=>{e.preventDefault();if(h(document.getElementById("gp").value)===H){try{sessionStorage.setItem("fup-ok",H)}catch(x){}g.remove()}else{document.getElementById("ge").textContent="Senha incorreta.";document.getElementById("gp").select()}}})();
</script>
